name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes per ref so the keep-last-N prune never races a sibling run.
concurrency:
  group: publish-dorado-hd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Android Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

      - name: Assemble release (signed)
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleRelease --stacktrace
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Assemble debug (fallback when keystore absent)
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew assembleDebug --stacktrace
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

      - name: Unit tests + UI parity suites + design-invariant audit
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: UI parity source guards
        run: python3 tools/ui_lint.py

      - name: Corpus tooling syntax check
        run: python3 -m py_compile tools/*.py

      - name: Select APK artifact
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dorado-hd-apk
          path: ${{ env.APK_PATH }}

  publish:
    name: Publish APK
    needs: build
    # Publish on every main push (auto-tagged with the commit hash) and on demand.
    # Pull requests and other branches only build + test.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: dorado-hd-apk
          path: apk

      - name: Name APK with commit hash
        run: |
          src_apk=$(find apk -name '*.apk' | head -n1)
          cp "$src_apk" "dorado-hd-${SHORT_SHA}.apk"

      - name: Generate Checksums
        run: sha256sum dorado-hd-${SHORT_SHA}.apk > SHA256SUMS

      - name: Import GPG Key
        if: env.HAS_GPG == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        env:
          HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}

      - name: Sign Checksums
        if: env.HAS_GPG == 'true'
        run: gpg --batch --yes --detach-sign --armor SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dorado-hd-*.apk
            SHA256SUMS*

      # Each main-branch commit is published as a prerelease tagged with the
      # short commit hash for a stable per-commit download URL.
      - name: Publish per-commit prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dorado-hd-${{ env.SHORT_SHA }}
          name: dorado-hd build ${{ env.SHORT_SHA }}
          prerelease: true
          generate_release_notes: true
          files: |
            dorado-hd-${{ env.SHORT_SHA }}.apk
            SHA256SUMS*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bound the number of per-commit prereleases.
      - name: Prune old prereleases (keep 10)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)
                       | select(.tagName | startswith("dorado-hd-"))
                       | .tagName] | .[10:] | .[]')
          for t in $tags; do
            echo "deleting stale prerelease $t"
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
